[project]
name = "mycu"
version = "0.1.0"
description = "A personal client for your own Cedarville student records"
requires-python = ">=3.12"

# Dependencies are supplied by flake.nix on desktop. This list exists for
# pyside6-android-deploy, which reads project metadata to decide what to bundle
# into the APK.
#
# Deliberately pure-Python: every C extension here needs a cross-compilation
# recipe in python-for-android. `lxml` used to be in this list for the
# meal-plan page; it was replaced by `mycu.core.minihtml` (stdlib
# `html.parser`) precisely so the APK needs no native build beyond Qt itself.
# Do not add a C-extension dependency without reading docs/android.md first.
dependencies = [
    "PySide6>=6.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
mycu = "mycu.ui.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mycu*"]

[tool.setuptools.package-data]
# The PNG is the header logo. It lives in the QML directory rather than in
# assets/ because the Android build stages only the package — see
# docs/architecture.md — and it has to be listed here for the same reason the
# .qml files do: neither is a module, so nothing installs them by default.
"mycu.ui" = ["qml/*.qml", "qml/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:mycu.*"]
